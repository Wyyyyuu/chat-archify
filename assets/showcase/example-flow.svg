<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1088" viewBox="0 0 760 1088" role="group" aria-labelledby="graph-title graph-desc">
<title id="graph-title">虚构阅读计划讨论 · 对话脉络图</title>
<desc id="graph-desc">从上向下阅读。实线为明确关系；虚线为推测或仅时间先后。节点可点击进入详情和产物链接。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#81928f"/></marker></defs>
<style>text{font-family:system-ui,"Microsoft YaHei",sans-serif}.box{fill:#fff;stroke:#ccd5d1;stroke-width:1.4}</style>
<rect width="760" height="1088" fill="#f5f7f3"/>
<text x="32" y="39" font-size="20" font-weight="650" fill="#18372f">虚构阅读计划讨论</text>
<text x="32" y="66" font-size="12" fill="#52685f">实线：明确关系　 ·　 虚线：推测 / 仅先后　 ·　 完整交互见 HTML 示例</text>
<g class="edge" data-edge="0"><title>分叉: 从阅读目标提出每日短读候选。</title><path d="M380.0,280 C380.0,321.0 216.0,321.0 216.0,362" fill="none" stroke="#81928f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="298.0" y="315.0" text-anchor="middle" fill="#52685f" font-size="11" paint-order="stroke" stroke="#f5f7f3" stroke-width="5" stroke-linejoin="round">分叉</text></g>
<g class="edge" data-edge="1"><title>分叉: 从同一阅读目标提出周末集中候选。</title><path d="M380.0,280 C380.0,321.0 544.0,321.0 544.0,362" fill="none" stroke="#81928f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="462.0" y="315.0" text-anchor="middle" fill="#52685f" font-size="11" paint-order="stroke" stroke="#f5f7f3" stroke-width="5" stroke-linejoin="round">分叉</text></g>
<g class="edge" data-edge="2"><title>合并: 每日短读被选为弹性计划的默认安排。</title><path d="M216.0,522 C216.0,563.0 380.0,563.0 380.0,604" fill="none" stroke="#81928f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="298.0" y="557.0" text-anchor="middle" fill="#52685f" font-size="11" paint-order="stroke" stroke="#f5f7f3" stroke-width="5" stroke-linejoin="round">合并</text></g>
<g class="edge" data-edge="3"><title>合并: 周末方案作为忙碌时的补读选项纳入计划。</title><path d="M544.0,522 C544.0,563.0 380.0,563.0 380.0,604" fill="none" stroke="#81928f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="462.0" y="557.0" text-anchor="middle" fill="#52685f" font-size="11" paint-order="stroke" stroke="#f5f7f3" stroke-width="5" stroke-linejoin="round">合并</text></g>
<g class="edge" data-edge="4"><title>延续: 讨论提出一个月后复盘，但尚无执行结果。</title><path d="M380.0,764 C380.0,805.0 380.0,805.0 380.0,846" fill="none" stroke="#81928f" stroke-width="1.6" marker-end="url(#arrow)"/><text x="380.0" y="799.0" text-anchor="middle" fill="#52685f" font-size="11" paint-order="stroke" stroke="#f5f7f3" stroke-width="5" stroke-linejoin="round">延续</text></g>
