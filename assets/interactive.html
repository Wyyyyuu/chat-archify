<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; frame-src 'self' about: blob:; font-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<meta name="color-scheme" content="light dark">
<title>@@TITLE@@</title>
<style>
:root{color-scheme:light;--paper:#f4f5f7;--panel:#fff;--ink:#202b3a;--muted:#586476;--line:#dbe1e8;--accent:#245bce;--soft:#edf3ff;--shadow:0 18px 60px #182b4520}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#141923;--panel:#1d2532;--ink:#edf2fa;--muted:#b5c0d2;--line:#374359;--accent:#96b9ff;--soft:#293952;--shadow:0 18px 60px #0007}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit;color:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:var(--accent);text-underline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}
.top{display:flex;gap:20px;justify-content:space-between;align-items:center;padding:18px 26px;background:var(--panel);border-bottom:1px solid var(--line)}h1{font-size:23px;letter-spacing:-.03em;line-height:1.3;margin:0}.eyebrow{font-size:11px;letter-spacing:.09em;color:var(--muted);margin-bottom:4px}.top p{margin:5px 0 0;color:var(--muted);font-size:12px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.button{background:var(--panel);border:1px solid var(--line);border-radius:7px;min-height:36px;padding:6px 11px;white-space:nowrap}.button:hover{background:var(--soft)}.button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}input,select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0;max-width:100%}.search{position:relative;width:270px}.search input{width:100%}.results{position:absolute;top:calc(100% + 6px);right:0;width:min(420px,90vw);max-height:380px;overflow:auto;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow)}.result{display:block;width:100%;text-align:left;padding:10px 13px;background:none;border:0;border-bottom:1px solid var(--line)}.result:hover{background:var(--soft)}.result small{display:block;color:var(--muted)}
nav{display:flex;gap:4px;padding:12px 26px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line)}.tab{border:0;background:none;border-radius:6px;padding:8px 13px;color:var(--muted)}.tab[aria-selected="true"]{background:var(--soft);color:var(--accent);font-weight:600}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;padding:16px;max-width:2100px;margin:auto;align-items:start}.graph-panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}.graph-tools{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.graph-tools label{display:flex;gap:8px;align-items:center;min-width:0;flex:1}.graph-tools select{flex:1;max-width:430px}.graph-tools .hint{font-size:11px;color:var(--muted)}iframe{display:block;border:0;width:100%;height:73vh;min-height:540px;background:var(--panel)}.graph-foot{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}aside{background:var(--panel);border:1px solid var(--line);border-radius:11px;max-height:calc(100vh - 36px);overflow:auto;position:sticky;top:16px}.detail-header{padding:20px;border-bottom:1px solid var(--line);background:var(--soft)}.detail-header h2{font-size:21px;line-height:1.4;margin:6px 0}.meta,.note{font-size:12px;color:var(--muted)}.status{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid var(--line);border-radius:4px}.section{padding:18px 20px;border-bottom:1px solid var(--line)}.section h3{font-size:12px;color:var(--muted);margin:0 0 10px}.section p{margin:0 0 9px;overflow-wrap:anywhere}.item{padding:11px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0;padding-top:0}.item strong{display:block;overflow-wrap:anywhere}.item .actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.item .button{font-size:12px;min-height:31px}.link-button{border:0;background:none;padding:2px 0;text-align:left;color:var(--accent);text-decoration:underline;text-underline-offset:3px}.coverage{margin:0 16px 24px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12px}.coverage summary{cursor:pointer}.coverage p{overflow-wrap:anywhere}.wide .workspace{grid-template-columns:1fr}.wide aside{display:none}.wide iframe{height:78vh}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
dialog{padding:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(1120px,94vw);max-height:90vh;box-shadow:var(--shadow)}dialog::backdrop{background:#071426a0}.modal-head{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}.modal-head h2{font-size:19px;margin:0;overflow-wrap:anywhere}.modal-sub{font-size:12px;color:var(--muted);padding:10px 20px}.preview{padding:0 20px 20px;min-height:160px}.preview pre{padding:16px;margin:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;font:12px/1.65 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto}.preview img{display:block;max-width:100%;height:auto;margin:auto}.path{display:flex;align-items:flex-start;gap:10px;padding:12px 20px;border-top:1px solid var(--line);font-size:11px}.path code{overflow-wrap:anywhere;flex:1}.close{font-size:20px;min-width:36px}.copy-fallback{width:100%;min-height:65px}.notice{padding:8px 16px;color:var(--muted);font-size:12px}
@media(max-width:1100px){.top{align-items:flex-start;padding:16px}.workspace{grid-template-columns:minmax(0,1fr) 320px;gap:10px;padding:10px}.tools{justify-content:flex-end}.search{width:220px}nav{padding:10px 16px}.detail-header,.section{padding:16px}}
@media(max-width:780px){.top{display:block}.tools{justify-content:flex-start;margin-top:12px}.search{flex:1;width:auto;min-width:160px}h1{font-size:22px}.workspace{display:block}.graph-panel{margin-bottom:12px}aside{position:static;max-height:none}.graph-tools{align-items:stretch}.graph-tools label{display:block;flex-basis:100%}.graph-tools select{width:100%;max-width:none;margin-top:4px}iframe{height:560px;min-height:0}.wide iframe{height:650px}.graph-tools .hint{display:none}.tab{padding:8px 10px}.modal-head{align-items:flex-start;gap:10px;padding:12px}.modal-head .tools{margin:0}.modal-head h2{font-size:17px}.path{display:block}.path button{margin-top:8px}.preview{padding:0 12px 12px}.results{left:0;right:auto}input,select{font-size:16px}}

/* Node resources stay visible in the top layer at every viewport width. */
.workspace{grid-template-columns:minmax(0,1fr);max-width:1800px}#node-dialog{width:min(760px,94vw);max-height:88vh;overflow:auto}#node-dialog .detail-header{padding:12px 20px}#node-dialog .detail-header h2{display:none}.resource-link{display:block;font-weight:650;font-size:15px;text-decoration:underline;overflow-wrap:anywhere}.resource-link:hover{background:var(--soft)}#node-dialog .section:first-of-type{background:var(--soft)}
</style>
</head>
<body>
<header class="top"><div><div class="eyebrow">CHAT ARCHIFY / INTERACTIVE</div><h1>@@TITLE@@</h1><p>点击任意节点 → 弹出相关资源 → 点击文件名打开，或预览、下载。</p></div><div class="tools"><div class="search"><label class="sr" for="search">搜索事件和产物</label><input id="search" type="search" placeholder="搜索事件、决策或文件" autocomplete="off"><div class="results" id="results" hidden></div></div><button class="button" id="wide">查看所选资源</button><button class="button" id="about">阅读说明</button></div></header>
<nav id="chapters" role="tablist" aria-label="演进主题"></nav>
<main class="workspace"><section class="graph-panel" aria-label="可交互演进图"><div class="graph-tools"><label for="node-picker">定位阶段<select id="node-picker"></select></label><span class="hint" id="graph-count"></span></div><iframe id="viewer" title="Archify 项目演进交互图" sandbox="allow-scripts allow-same-origin allow-downloads" referrerpolicy="no-referrer"></iframe><div class="graph-foot"><span>拖动／缩放 · 点击节点打开资源弹窗</span><button class="link-button" id="native-download">下载此主题框图（不含附件）</button></div><div class="notice" id="viewer-note" hidden>图内联动暂不可用，可通过“定位阶段”查看全部节点与附件。</div></section></main>
<details class="coverage" id="coverage"><summary>来源覆盖与验证边界</summary><div id="coverage-body"></div></details>
<dialog id="node-dialog" aria-labelledby="node-title"><div class="modal-head"><h2 id="node-title"></h2><button class="button close" id="node-close" aria-label="关闭节点资源">×</button></div><div id="detail" aria-label="节点资源与详情"></div></dialog>
<dialog id="file-dialog" aria-labelledby="file-title"><div class="modal-head"><div><h2 id="file-title"></h2><div class="meta" id="file-meta"></div></div><div class="tools"><button class="button primary" id="file-download">下载文件</button><button class="button close" id="file-close" aria-label="关闭预览">×</button></div></div><div class="modal-sub" id="file-note"></div><div class="preview" id="file-preview"></div><div class="path"><code id="file-path"></code><button class="button" id="copy-path">复制原始路径</button></div></dialog>
<div class="sr" id="announce" role="status" aria-live="polite"></div>
<noscript><p>请在支持 JavaScript 的浏览器中打开此文件，以查看交互框图和内置附件。</p></noscript>
<script type="application/json" id="explorer-data">@@PAYLOAD@@</script>
<script>@@SCRIPT@@</script>
</body>
</html>
