<body>
<header class="top"><div><div class="eyebrow">CHAT ARCHIFY PRO / INTERACTIVE</div><h1>@@TITLE@@</h1><p>先看项目全貌，点击阶段进入具体流程。</p></div><div class="tools"><div class="search"><label class="sr" for="search">搜索阶段、文件和对话摘录</label><input id="search" type="search" placeholder="搜索阶段、文件或对话摘录" autocomplete="off"><div class="results" id="results" hidden></div></div><button class="button" id="history-back" aria-label="返回上一阅读位置" title="返回">← 返回</button><button class="button" id="history-forward" aria-label="前往下一阅读位置" title="前进">前进 →</button><button class="button" id="project-overview">项目总览</button><button class="button" id="conversation-open">对话索引</button><button class="button" id="continuation-open">续聊包</button><button class="button" id="update-review-open">审查更新</button><button class="button" id="about">阅读说明</button><div class="mobile-switch" role="tablist" aria-label="移动端视图"><button class="button" id="mobile-overview" role="tab" aria-selected="true">总览</button><button class="button" id="mobile-map" role="tab" aria-selected="false">流程</button><button class="button" id="mobile-reader" role="tab" aria-selected="false">详情</button></div></div></header>
<main class="workbench overview-mode" id="workspace"><aside class="overview-panel" id="overview-panel" aria-label="项目总览流程图"><div class="overview-head"><strong>项目总览</strong></div><button class="overview-back" id="rail-overview" type="button" aria-current="true"><span aria-hidden="true">⌂</span><span>返回总览</span></button><div class="overview-host" id="overview-host"><div class="native-graph overview-graph" id="overview-graph"></div></div><p class="overview-note" id="rail-note"></p></aside><div class="column-splitter" id="splitter-overview-graph" role="separator" aria-orientation="vertical" aria-label="调整总览与章节流程宽度" tabindex="0"></div><section class="graph-panel" id="chapter-panel" aria-label="章节流程图"><div class="graph-tools"><div class="graph-actions" aria-label="流程图缩放"><button class="button" id="graph-fit" type="button" title="按栏宽显示流程图">适应宽度</button><button class="button" id="graph-zoom-out" type="button" aria-label="缩小">−</button><button class="button" id="graph-zoom-in" type="button" aria-label="放大">＋</button></div></div><div class="graph-host" id="viewer-host"><div class="graph-empty" id="graph-empty">点击左侧流程框，查看阶段流程</div><div class="native-graph" id="native-graph" hidden></div></div><div class="graph-foot"><span class="graph-hint">点击节点查看说明和相关资源</span><button class="link-button" id="native-download">下载此主题框图（不含附件）</button></div><div class="notice" id="viewer-note" hidden>图内联动暂不可用，当前章节仍可通过流程框查看。</div></section><div class="column-splitter" id="splitter-graph-reader" role="separator" aria-orientation="vertical" aria-label="调整章节流程与详情宽度" tabindex="0"></div><aside class="reader-panel" id="reader-panel" aria-label="节点详情"><div class="reader-bar"><div class="history-controls"><button class="button" id="reader-back" aria-label="返回上一阅读位置" title="返回">←</button><button class="button" id="reader-forward" aria-label="前进" title="前进">→</button></div><div class="breadcrumbs" id="breadcrumbs" aria-label="当前位置"></div><button class="button" id="reader-graph">查看图</button><button class="button" id="reader-close" aria-label="关闭阅读面板">×</button></div><h2 class="reader-heading" id="reader-title" tabindex="-1">选择流程中的节点，查看说明与文件</h2><div class="reader-actions" id="reader-actions"></div><div id="reader-content" tabindex="0"></div></aside></main>
<dialog id="conversation-dialog" aria-labelledby="conversation-dialog-title" aria-describedby="conversation-dialog-meta" aria-modal="true"><div class="conversation-dialog-shell"><div class="conversation-dialog-head"><div><div class="conversation-dialog-eyebrow">已保存对话摘录</div><h2 id="conversation-dialog-title">对话摘录</h2><p id="conversation-dialog-meta" class="conversation-dialog-meta"></p></div><button class="button conversation-dialog-close" id="conversation-dialog-close" type="button" aria-label="关闭对话阅读框">×</button></div><div id="conversation-dialog-content" class="conversation-dialog-content" tabindex="0"></div></div></dialog>
<dialog id="continuation-dialog" class="pro-tools-dialog" aria-labelledby="continuation-title" aria-modal="true"><div class="pro-tools-shell"><div class="pro-tools-head"><div><h2 id="continuation-title">续聊包</h2><p>把当前证据边界整理成下一步可审查的输入。</p></div><button class="button pro-tools-close" id="continuation-close" type="button" aria-label="关闭续聊包">×</button></div><div class="pro-tools-body" id="continuation-root"></div></div></dialog>
<dialog id="update-review-dialog" class="pro-tools-dialog" aria-labelledby="update-review-title" aria-modal="true"><div class="pro-tools-shell"><div class="pro-tools-head"><div><h2 id="update-review-title">审查更新</h2><p>读取旧版本与当前候选的结构化记录；不会执行 HTML 或脚本。</p></div><button class="button pro-tools-close" id="update-review-close" type="button" aria-label="关闭审查更新">×</button></div><div class="pro-tools-body" id="update-review-root"></div></div></dialog>
<details class="coverage" id="coverage"><summary>来源覆盖与验证边界</summary><div id="coverage-body"></div></details>
<div class="sr" id="announce" role="status" aria-live="polite"></div>
<noscript><p>请在支持 JavaScript 的浏览器中打开此文件，以查看交互框图和内置附件。</p></noscript>
<script type="application/json" id="explorer-data">@@PAYLOAD@@</script>
<script>@@SCRIPT@@</script>
</body>
</html>
